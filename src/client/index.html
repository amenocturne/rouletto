<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Casino Wheel</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="/styles.css">
</head>
<body>
	<div id="app">
		<!-- Join form - shown initially -->
		<div id="join-screen" class="screen">
			<h1>Casino Wheel</h1>
			<form id="join-form">
				<input type="text" id="name-input" placeholder="Enter your name" required maxlength="20">
				<button type="submit">Join Game</button>
			</form>
		</div>

		<!-- Game screen - shown after joining -->
		<div id="game-screen" class="screen hidden">
			<div id="game-header">
				<h2>Players</h2>
				<div id="phase-indicator"></div>
				<div id="countdown"></div>
			</div>
			<div id="player-list"></div>
			<div id="wheel-container"></div>
			<div id="host-controls"></div>
			<div id="result-overlay" class="hidden"></div>
		</div>
	</div>
	<script src="/dist/index.js"></script>
</body>
</html>
